# 语棱 Lingua Prism: static site served from /var/www/lingua-prism.
# Put this file at /etc/nginx/conf.d/lingua-prism.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name lingua-prism.default;  # default_server answers for the bare IP and any other name

    root /var/www/lingua-prism;
    index index.html;

    # The 11 MB Chinese typeface and the JSON data compress well; images and audio are already compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/ttf application/x-font-ttf font/otf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # /center -> /center/, and each page folder serves its own index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # Built files carry a content hash in their names, so they never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # This Nginx doesn't know .ttf, so it would send application/octet-stream. The two Chinese
    # faces are 8 MB each; deploy.sh compresses them once, and gzip_static serves that copy.
    location ~* \.ttf$ {
        default_type font/ttf;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # Fonts and test materials rarely change; keep them a month.
    location ~* ^/(fonts|tall)/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # Pages must be re-checked on every visit, or a new release would not show up.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # The site has no server code: nothing hidden should ever be served.
    location ~ /\. { deny all; }
}
