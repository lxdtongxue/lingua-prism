name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/
      - name: Compress fonts
        run: find dist/fonts -type f -name '*.ttf' -exec gzip -9 -k {} \;
      - name: Upload and activate
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.TENCENT_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/tencent"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/tencent"' EXIT
          SSH=(ssh -i "$HOME/.ssh/tencent" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          TARGET="lingua-deploy@$DEPLOY_HOST"
          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE="/var/www/lingua-prism-auto/releases/$RELEASE"
          "${SSH[@]}" "$TARGET" "mkdir -p '$REMOTE'"
          tar -C dist -czf - . | "${SSH[@]}" "$TARGET" "tar -xzf - -C '$REMOTE'"
          "${SSH[@]}" "$TARGET" "bash -s -- '$RELEASE'" < deploy/activate.sh
          printf 'Deployed commit %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
